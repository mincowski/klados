name: Release

# R141 (`docs/plans/R140-publication.md` §3). `ci.yml` deliberately excludes
# packaging; this is the round it defers to.
#
# Tag-driven: pushing `v1.0.0` builds on all three platforms and uploads to a
# **draft** release, which is electron-builder's own default and is kept on
# purpose — three runners finish at different times, and a draft lets them
# accumulate onto one release that a human publishes after looking at it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# electron-builder uploads the artifacts itself, which needs write access to
# releases. Nothing else here writes to the repository.
permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      # Never fail-fast: one platform's build failing should not cancel the
      # others, or a single flake costs a whole release round trip.
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            # NSIS installer. `win.target` is unset in electron-builder.yml, so
            # this is electron-builder's default and there is no portable build
            # — deliberate, see §3 of the plan.
            args: ''

          # macOS is two jobs, one per architecture, rather than one job passing
          # `--x64 --arm64`. The reason is naming: an `artifactName` pattern has
          # no conditional, so it cannot say "arm64 → -mac, x64 → -mac-intel",
          # and the two labels are what make the download obvious to someone who
          # does not know what their Mac has inside it. Splitting lets each job
          # override the pattern with `-c.dmg.artifactName`, which is verified
          # to work.
          #
          # The single quotes matter: the value reaches bash before
          # electron-builder, and ${name} unquoted expands to an empty shell
          # variable.
          - name: macos-apple-silicon
            os: macos-latest
            args: >-
              --arm64 -c.dmg.artifactName='${name}-${version}-mac.${ext}'
          - name: macos-intel
            os: macos-latest
            args: >-
              --x64 -c.dmg.artifactName='${name}-${version}-mac-intel.${ext}'

          - name: linux
            os: ubuntu-latest
            args: ''
    runs-on: ${{ matrix.os }}

    # R192, same reasoning as ci.yml, five minutes more because these jobs
    # package and upload rather than building to a directory and stopping.
    # 30 is 3.6x the slowest observed release job (windows 8.2 min).
    #
    # Guarded here too rather than only where the failure landed: a hung leg of
    # this matrix holds up `checksums` below, which `needs: release`, so one
    # stalled platform withholds the assets for all four. That is R182's
    # finding — a fix covering only the consumer that happened to fail is one
    # reordering away from the same outage.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tag and `package.json` are *not* connected: electron-builder takes
      # the version from package.json and GitHub takes the release name from the
      # tag. A mismatch produces a release called v1.2.0 containing files named
      # klados-1.1.0-*, which looks like a supply-chain problem and is merely a
      # slip. Fail the job instead.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      # Gates before anything is published. A release built from code that does
      # not typecheck or does not pass its own tests is worse than a late one.
      - run: npm run typecheck
      - run: npm run lint

      - run: npx playwright install --with-deps chromium

      # Linux only: `test/mainElectron.test.ts` launches the built app, and
      # Electron needs a display server a headless runner does not have. Same
      # reasoning as ci.yml.
      - name: Install xvfb
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -a npm test
          else
            npm test
          fi

      - name: Build and publish
        run: npm run package -- ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nothing is code-signed (no certificates, `notarize: false`), and the
          # macOS runner would otherwise try to sign with whatever identity it
          # finds in its keychain and fail confusingly. Being explicit turns
          # that into an unsigned build, which is what the README documents.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # R167 (`docs/plans/R164-release-security-hardening.md` §5) — publish a
  # SHA-256 for every artifact.
  #
  # The builds are unsigned by design (no certificates, `notarize: false`,
  # documented in the README) and there is no auto-updater, so the download *is*
  # the whole trust decision. An unsigned artifact with no integrity signal at
  # all gives a downloader nothing to check against a tampered mirror; a
  # published hash costs nothing and gives them something.
  #
  # **One job over the assembled release, not a step on each runner.** The plan
  # offered either; per-runner is three shells with three output formats
  # (`sha256sum`, `shasum -a 256`, `Get-FileHash`) plus a fourth step to merge
  # them, and it would hash what each runner *built* rather than what was
  # actually *published* — which is the thing a downloader compares against.
  # This reads the release back and hashes that.
  checksums:
    name: checksums
    needs: release
    # A tag is what creates the release these assets live on; a
    # `workflow_dispatch` run has no release to read back or upload to.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # R192. Downloads the release assets, hashes them, uploads one file; ten
    # minutes is far more than it needs and still bounded.
    timeout-minutes: 10
    steps:
      - name: Hash every published asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh` needs the repository when the workflow checks out nothing.
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          # Draft releases are addressable by tag for anyone with write access,
          # which is what `permissions: contents: write` above grants.
          gh release download "$GITHUB_REF_NAME" --dir assets

          cd assets
          # Exclude the sums file itself so a re-run is idempotent rather than
          # hashing its own previous output.
          rm -f SHA256SUMS.txt
          shopt -s nullglob
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no release assets found for $GITHUB_REF_NAME — nothing to hash"
            exit 1
          fi
          # The standard `<hash>␣␣<filename>` format, so `sha256sum -c` and
          # `Get-FileHash` comparison both work without anyone parsing anything.
          sha256sum "${files[@]}" > SHA256SUMS.txt
          echo "hashed ${#files[@]} assets:"
          cat SHA256SUMS.txt

          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
