name: CI

# R49 (R47-repo-hygiene.md): nothing prevented a push that failed
# typecheck, lint, or either test project. R47 is a prerequisite — this
# gates on `npm run lint`, and that command only became meaningful once the
# buried CRLF signal stopped hiding real errors under it.
#
# R151 (`docs/plans/R151-ci-matrix.md`): three platforms, not one. This ran
# ubuntu-only while `release.yml` ran four jobs on a `v*` tag, and over the
# published history **the two disagreed on all four commits where both ran**,
# in both directions — green here said nothing about whether a release would
# build, and red here said nothing about whether the code was broken. Both
# release failures had the same cause: a test failing on a platform this
# workflow never ran.
#
# Deliberately not in scope: release/packaging automation, signing or
# notarization. Those belong to `release.yml`.

on:
  push:
    branches: [main]
  pull_request:

# R151: without this, three pushes to a branch under review leave nine jobs
# racing for the same answer. Only started mattering once work landed through
# pull requests rather than straight onto `main`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      # One platform's failure must not cancel the evidence from the other
      # two — the whole value here is seeing *which* platforms disagree.
      fail-fast: false
      matrix:
        # macOS is one job, not two. `macos-latest` is arm64, and
        # `release.yml`'s Intel job exists to produce a second *binary*, not
        # to exercise different code; nothing in this suite is
        # architecture-dependent.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Everything from here to the test step runs identically on all three,
      # with no `if:`, deliberately: an asymmetric matrix leaves steps that
      # only ever execute on one OS, which is the exact shape of the problem
      # R151 exists to close.
      #
      # The value of running `lint` on Windows is narrow but real, and worth
      # naming precisely so nobody "optimizes" it away: `.gitattributes` sets
      # `* text=auto eol=lf`, so a Windows checkout is already LF and Prettier
      # sees what Linux sees. This run guards *that normalization* — which is
      # R47's actual finding — rather than re-finding R47 itself.
      - run: npm run typecheck

      - run: npm run lint

      # R54 addendum (R54-signal-followups.md): `typecheck` is four
      # `tsc --noEmit` passes and never invokes Vite, so it cannot catch a
      # bundling failure. Demonstrated: replacing an icon import's path with
      # a file that does not exist still typechecks clean, because
      # `vite/client`'s ambient `*.svg?raw` declaration types any such path —
      # only the real build resolves the file. R38 added four of those
      # imports.
      #
      # `npx electron-vite build`, not `npm run build`: that script is
      # `npm run typecheck && electron-vite build`, and typecheck already ran
      # as its own step above. Running it here too would double ~40s and
      # report a type error under a step labelled "build".
      - run: npx electron-vite build

      # R157 (`docs/plans/R157-package-check.md`): `electron-vite build` is a
      # bundler run and stops there — it never invokes electron-builder, so
      # until now **nothing on a pull request executed a single line of the
      # packaging toolchain.** That was not theoretical: two Dependabot bumps
      # (`fast-uri` under `ajv`, `@xmldom/xmldom` under `plist`, both beneath
      # `app-builder-lib`) went green on all three platforms while the suite
      # could not reach either package. Green meant "the dependency tree still
      # installs", and was read as more.
      #
      # `--dir` produces the unpacked application and stops before the
      # installer targets. That is the deliberate boundary: it runs config
      # validation through ajv, the asar/file-copy stage, the Windows
      # executable rename and macOS's Info.plist generation through plist — so
      # it does reach both packages above — while skipping NSIS, dmg, AppImage
      # and fpm. It would not have caught R141's dmg filename collision, and
      # §4 of the plan says why buying that costs more than it returns.
      #
      # No `GH_TOKEN` and no `--publish`: this builds and throws the result
      # away. `CSC_IDENTITY_AUTO_DISCOVERY: false` for the same reason
      # `release.yml` sets it — the macOS runner would otherwise try to sign
      # the app bundle with whatever identity it finds in its keychain and fail
      # confusingly, when unsigned is what this project ships.
      - name: Package (unpacked)
        run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The browser project (`vitest.config.ts`) drives real Chromium via
      # Playwright — needs the browser binary and its OS-level deps
      # installed before `npm test` (which now runs both projects, R48a).
      - run: npx playwright install --with-deps chromium

      # `test/mainElectron.test.ts` launches the *built* app through
      # Playwright's `_electron`. Electron is a real GUI process and needs a
      # display server; a headless Linux runner has none, so no window is ever
      # created, `firstWindow()` never resolves, and the suite fails on a hook
      # timeout rather than on anything it was trying to assert.
      #
      # Xvfb rather than skipping the test on CI: it is the only test that
      # exercises the packaged application end to end, which makes it the one
      # least worth dropping from the pipeline that packages it. The suite's
      # own guard already skips it when `out/main/index.js` is absent, so this
      # covers the other half of the same question — the binary exists, but
      # there is nowhere to show it.
      #
      # Windows and macOS runners have a desktop session already, so this is
      # one of exactly two Linux-only steps.
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a npm test
          else
            npm test
          fi
