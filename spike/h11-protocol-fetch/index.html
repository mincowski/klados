<!doctype html>
<html>
  <body>
    <script>
      const { ipcRenderer } = require('electron')
      ipcRenderer.send('spike:before')
      try {
        const worker = new Worker('worker.js')
        worker.onmessage = (e) => ipcRenderer.send('spike:result', e.data)
        worker.onerror = (e) => ipcRenderer.send('spike:error', e.message || String(e))
      } catch (err) {
        ipcRenderer.send('spike:error', 'sync: ' + (err && err.message))
      }
    </script>
  </body>
</html>
