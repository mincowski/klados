<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>M0a/A6 — windowed CodeMirror harness</title>
    <style>
      html, body { margin: 0; height: 100%; font: 12px system-ui; }
      #status { position: fixed; z-index: 10; bottom: 0; left: 0; right: 0;
                background: #111; color: #0f0; padding: 4px 8px;
                font-family: ui-monospace, monospace; }
      #editor { height: 100vh; }
      .cm-editor { height: 100%; }
      .cm-scroller { overflow: auto; }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <div id="status">starting…</div>
    <!--
      Loaded via require(), not <script src>. A classic script shares global
      scope with window; require() gives the bundle proper module scope.
    -->
    <script>
      require(require('path').join(__dirname, 'dist', 'renderer-windowed.cjs'));
    </script>
  </body>
</html>
