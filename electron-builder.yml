appId: com.klados.app
# R172c: pinned rather than derived. It names the same holder and year as
# `LICENSE` line 3, which is the point of pinning it; the two differ in the
# symbol only, because a licence file conventionally keeps the ASCII `(c)`.
#
# Left unset, `AppInfo.copyright` (`appInfo.js:129`) derives
# `Copyright © <build year> <companyName>` — and `companyName` is
# `package.json`'s `author.name`, which R172a changed from a person to the
# project. That would name a copyright holder which does not exist: there is
# no Klados entity, natural or legal, and the notice would contradict the one
# file that actually grants the licence. `Klados contributors` is the
# ordinary collective handle for the natural persons who each hold copyright
# in their own contribution.
#
# The year is frozen deliberately. The derived form recomputes it with
# `new Date().getFullYear()` at build time; an explicit string cannot,
# because electron-builder's macro expander has no year token. That trades a
# value tracking the build clock for one stating a fact — 2026 is when Klados
# was first published, which is what the notice is for.
#
# It lands in three artifacts: `LegalCopyright` on `Klados.exe`
# (`winPackager.js:141`) and on the installer (`NsisTarget.js:390`), and
# macOS's `NSHumanReadableCopyright` (`macPackager.js:400`).
copyright: Copyright © 2026 Klados contributors
directories:
  buildResources: assets/build
# R190: an allowlist, replacing a list of exclusions.
#
# electron-builder's default is `**/*`, and a list of negative patterns
# *narrows* that default rather than replacing it — so the rule in force was
# "ship the entire working tree except these six patterns". It shipped
# `docs/` (105 files), `test/` (171), `CLAUDE.md`, `.claude/`, `scripts/`,
# `tools/` and the tsconfigs, and locally `spike/fixtures/` too: a 1202 MB
# asar whose application part is `out/`, eight files, 2.0 MB.
#
# The old list is worth describing because it argues the case. It excluded
# three tsconfigs; the repository has five, the other two having been added
# later with nothing to prompt anyone back here. It excluded `README.md` and
# not `CLAUDE.md`, which did not exist when the line was written. A default
# that must be actively narrowed rots; one that must be actively widened
# cannot.
#
# `out/**` is the built application, including the `?asset` outputs
# electron-vite emits into `out/main/chunks/` — which is why `assets/` is not
# here. `package.json` is required: Electron reads `main` from it. `LICENSE`
# is deliberate, being a condition of distributing the software.
#
# **`node_modules` is absent on purpose and is still packed.** electron-builder
# collects production dependencies outside this matcher, driven by the
# dependency tree rather than by these patterns; verified by building with
# exactly these three entries and finding `node_modules` at 22.7 MB in the
# asar. Adding it here would be redundant and would imply these patterns
# govern it.
#
# Guarded by `test/packagedFiles.test.ts`, which resolves these patterns
# against `git ls-files` and fails on a negative pattern or a broad one.
files:
  - out/**
  - package.json
  - LICENSE
# R195: ship one locale, not 55.
#
# Electron's `locales/` is 45 MiB of Chromium `.pak` files — its own context
# menus and error pages in 54 languages this application does not speak, having
# no translations of its own. Trimming to one takes the directory to 1 MiB and
# the unpacked application from 356 to 312 MiB. Measured, and the packaged app
# launches unchanged.
#
# **It must be `en-US` and not `en`, and getting that wrong is silent.**
# electron-builder keeps a locale file when
#
#     wanted === file || wanted.startsWith(file + '-') || wanted.startsWith(file + '_')
#
# (`app-builder-lib/out/electron/ElectronFramework.js`). Read the direction: it
# asks whether the *wanted* string starts with the *file's* name, not the
# reverse. Windows Electron ships `en-GB.pak` and `en-US.pak` and **no
# `en.pak`** — so `en` matches nothing and deletes all 55, English included.
#
# Verified by building it both ways, and nothing tells you: the build succeeds,
# the "no locales found matching wanted languages" warning fires only when
# *nothing* was deleted so it stays quiet, and the zero-locale application
# launches cleanly. The symptom arrives much later as a missing string in a
# Chromium-drawn menu.
#
# `en-US` is also correct on macOS, whose framework ships `en.lproj`:
# `"en-us".startsWith("en-")` is true, so it survives. The same asymmetry that
# makes `en` wrong makes `en-US` right on both platforms.
#
# **Revisit this the day Klados gains translations.** The guard below checks
# only that the configured value matches a locale that exists, so it would go
# on passing for a localized application shipping English-only Chromium
# strings. Nothing else will raise it.
#
# Guarded by `test/electronLanguages.test.ts`, which runs that predicate
# against the real locale names Electron ships — searched rather than read from
# a fixed path, because the layout differs by platform (`.pak` under
# `locales/`, or `.lproj` inside the macOS framework bundle).
#
# Measured both ways: **installed 356 -> 312 MiB, installer 88.6 -> 81.3 MB.**
# The download saves far less than the disk does because `.pak` files are
# text-heavy and compress well, so most of the 45 MiB was never on the wire.
electronLanguages:
  - en-US
win:
  executableName: Klados
nsis:
  # Pinned rather than derived. electron-builder computes this as UUID v5 of
  # `appId` under its own namespace (`com.klados.app` yields exactly this
  # value today) and names the Add/Remove Programs registry key after it.
  # Package managers and updaters key installed state off that name, so
  # changing `appId` later would silently orphan every existing install: no
  # upgrade detection, no uninstall entry to match. Freezing the value makes
  # the installed identity independent of the appId. **Never change it.**
  guid: 318f6304-c1a1-5b48-8b0d-d9b77e332a6b
  # Stable across versions by construction, and it needs to stay that way:
  # once a release ships, the download URL is the handle anything downstream
  # (a package definition, a script, a link in an issue) refers to.
  artifactName: ${name}-${version}-setup.${ext}
  # No .blockmap. A blockmap is a content-chunk index that lets
  # `electron-updater` download only the changed blocks between versions — it
  # describes an update mechanism this application does not have. Verified that
  # turning it off leaves the installer untouched and simply stops emitting the
  # sidecar.
  differentialPackage: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # `false`, not the unset default. The policy has three values — NEVER,
  # FRESH_INSTALL (unset) and ALWAYS — and this was `always`, the most
  # intrusive: it recreates the icon on every update even after the user has
  # deleted it. A viewer opened from a file association or the Start menu does
  # not earn a permanent place on someone's desktop. The Start-menu entry is
  # governed separately (`createStartMenuShortcut !== false`) and is unaffected.
  createDesktopShortcut: false
mac:
  # dmg only. electron-builder's default macOS targets are dmg *and* zip, and
  # the zip exists almost entirely for `electron-updater`, which cannot update
  # from a dmg. This application has no auto-updater — `electron-updater` is not
  # a dependency and nothing calls `autoUpdater` — so the zips were two assets
  # serving nobody.
  target:
    - dmg
  entitlementsInherit: assets/build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Klados opens files from your Documents folder.
    - NSDownloadsFolderUsageDescription: Klados opens files from your Downloads folder.
  notarize: false
dmg:
  # R198: no blockmap. A blockmap is a content-chunk index letting
  # `electron-updater` fetch only the changed blocks between versions, and this
  # application has no updater — `electron-updater` is not a dependency and
  # nothing calls `autoUpdater`.
  #
  # **The same reasoning already removed two other things and stopped one step
  # short of here.** `mac.target` dropped the zips because they "exist almost
  # entirely for `electron-updater`… two assets serving nobody", and
  # `nsis.differentialPackage` turned the blockmap off for Windows in the same
  # words. The dmg was simply never revisited, so the first real release built
  # two of them. Found by reading the draft's asset list, not by any check.
  #
  # `dmg-builder/out/dmg.js` gates creation on exactly this flag:
  # `writeUpdateInfo === false ? null : createBlockmap(...)`.
  writeUpdateInfo: false
  # `${arch}` is not optional here, and leaving it out was a real bug: the
  # release builds both architectures, both dmgs were named
  # `klados-<version>.dmg`, and one silently overwrote the other — so the
  # published release carried a single dmg of indeterminate architecture and
  # half of macOS would have downloaded something that will not run. The zips
  # were unaffected only because they use electron-builder's default pattern,
  # which does include the arch; that asymmetry is what exposed it.
  #
  # The release workflow overrides this with friendlier, user-facing names
  # (`-mac` / `-mac-intel`) via `-c.dmg.artifactName`, because a pattern cannot
  # branch on architecture. This stays as the local default: unambiguous, and
  # it works without the workflow's environment.
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  # No `snap`: it needs snapcraft on the build machine, and a .snap that is not
  # in the Snap Store cannot be installed without `--dangerous` — worse than
  # shipping none at all. AppImage (portable, no install) plus .deb covers Linux.
  target:
    - AppImage
    - deb
  # R172b: pinned, and it must stay pinned. `FpmTarget.js:85` derives this
  # from `author.name` + `author.email` whenever it is absent, and R172a
  # changed `author.name` from a person to the project — so removing this line
  # would silently produce `Maintainer: Klados <8300485+mincowski@…>`.
  #
  # Debian's `Maintainer` means *the person responsible for the package*, and
  # its grammar is `Name <email>`. Who maintains the package and who publishes
  # the software are different questions with different answers here; they
  # shared one source until R172 separated them.
  #
  # An earlier version of this comment explained why the field was deliberately
  # *absent*, which was correct while `author.name` was still a person.
  maintainer: mincowski <8300485+mincowski@users.noreply.github.com>
  category: Utility
# R198: publish the artifacts, not the update metadata.
#
# Left implicit, electron-builder infers a GitHub provider and uploads
# `latest.yml`, `latest-mac.yml` and `latest-linux.yml` beside the installers —
# update *feeds*, read by `electron-updater` to discover a new version. This
# application has no updater, so the first release published three files that
# nothing will ever fetch, and `SHA256SUMS.txt` dutifully hashed all three.
#
# `provider: github` restates the inference rather than changing it; owner and
# repository are still derived the same way. `publishAutoUpdate: false` is read
# in `app-builder-lib/out/publish/updateInfoBuilder.js`, which skips writing the
# channel file entirely.
#
# **This does not disable publishing.** The installers, the dmgs, the AppImage
# and the .deb are uploaded exactly as before.
publish:
  provider: github
  publishAutoUpdate: false
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
