appId: com.klados.app
productName: Klados
directories:
  buildResources: assets/build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
win:
  executableName: Klados
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: assets/build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Klados opens files from your Documents folder.
    - NSDownloadsFolderUsageDescription: Klados opens files from your Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: klados
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
